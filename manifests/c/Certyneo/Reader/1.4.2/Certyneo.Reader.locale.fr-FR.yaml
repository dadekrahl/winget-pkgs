ReleaseNotes: |-
  - Certyneo Reader Pro : la même licence débloque désormais l’OCR dans 48 langues, la conversion en Word et Excel et le PDF/A.
  - OCR dans 48 langues, dont le russe et le chinois : le texte reconnu reste sélectionnable et copiable. Français et anglais restent gratuits.
  - Convertir un PDF en Word (titres, tableaux, gras et italique) ou en Excel (une feuille par page, montants écrits en nombres).
  - PDF/A-2b pour l’archivage légal : si le document ne peut pas être rendu conforme, la conversion le dit au lieu de produire un faux PDF/A.
  - Licence équipe : 5 ou 10 postes avec une seule clé et une seule facture.
  - Installé depuis Flathub, « À propos » indique que les mises à jour arrivent par Flathub, via votre logithèque ou « flatpak update ».
