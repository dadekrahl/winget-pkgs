ReleaseNotes: |-
  - Convertir en PDF : Word, Excel, PowerPoint, texte, RTF, images, photos HEIC, TIFF, PSD et Illustrator, sur votre ordinateur.
  - Glissez n’importe lequel de ces fichiers dans la fenêtre : il s’ouvre directement en PDF.
  - Rogner : marges au millimètre ou détection automatique des marges blanches, ou passage en A4, A3, A5, Lettre ou Légal.
  - Numéroter les pages : « 3 », « 3 / 12 » ou « Page 3 sur 12 », à l’emplacement voulu, avec ou sans la couverture.
  - Insérer des pages blanches ou celles d’un autre fichier ; supprimer, faire pivoter ou extraire des pages par leurs numéros.
  - PDF en PowerPoint : une diapositive par page, en image fidèle ou en texte modifiable.
  - Image en PDF accepte aussi les TIFF de plusieurs pages, les photos HEIC, le SVG et le PSD.
