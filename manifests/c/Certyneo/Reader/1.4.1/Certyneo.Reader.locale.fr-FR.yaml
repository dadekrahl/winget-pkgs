ShortDescription: "Lecteur PDF et traitement de texte gratuits : lire, annoter, remplir des PDF, rédiger et enregistrer en PDF ou Word, hors ligne."
Description: "Certyneo Reader est un lecteur PDF et un traitement de texte de bureau gratuits pour Windows, qui peut devenir votre application PDF par défaut. Recherche, miniatures, mode nuit, fichiers protégés par mot de passe et impression, mais aussi annotation, remplissage de formulaires, caviardage, filigrane, numérotation Bates et extraction du texte ou des tableaux. Son traitement de texte rédige des documents avec styles, polices, listes, tableaux, images, en-têtes et numéros de page, ouvre et enregistre les fichiers Word (.docx) et exporte des PDF balisés. Les documents restent sur votre ordinateur : tout fonctionne hors ligne, sans envoi du fichier. Vos propres documents se modifient gratuitement, même en PDF ; modifier le texte des autres PDF demande une licence annuelle facultative."
