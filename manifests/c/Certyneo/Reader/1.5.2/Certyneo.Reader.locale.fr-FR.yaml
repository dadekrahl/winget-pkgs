ReleaseNotes: |-
  - Arabe et persan : l’application s’affiche de droite à gauche — barre d’outils, menus, ruban et boîtes de dialogue.
  - Traitement de texte : le texte arabe part de la droite et les tableaux commencent à droite ; un paragraphe en anglais reste à gauche.
  - Les exports PDF et Word gardent le sens d’écriture de droite à gauche de vos documents.
  - Traitement de texte : coller un texte copié du web ou d’un e-mail ne fige plus la fenêtre ; un collage depuis Word garde ses listes.
  - Taper après un clic sur une image ou un champ de signature écrit au bon endroit ; Ctrl+Maj+V colle sans mise en forme.
  - Les commentaires et révisions ne sont plus joints au PDF exporté ou envoyé pour signature ; un avertissement signale les révisions en attente.
  - Un PDF modifié n’est plus perdu sans question quand vous en ouvrez un autre, le fermez ou changez de langue.
  - Le menu Outils PDF défile : Filigrane, Numéroter, Bates, Convertir et Traitement par lot sont de nouveau accessibles.
  - Filigrane entier et lisible sur les pages tournées ; Noir et blanc et Compression gardent le texte de ces pages ; la fusion garde les champs de formulaire.
  - Plus de 30 autres corrections issues d’une recette complète de l’application.
